<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSO Login</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  </head>

  <body>
    <main id="main-holder">
      <a href="/logout" id="logout">Logout</a>
      <h1 id="login-header">SSO Authentication</h1>
      <p id="status-msg">Redirecting to Auth0 SSO...</p>
    </main>
  </body>

  <style>
    html {
      height: 100%;
    }

    body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      display: grid;
      justify-items: center;
      align-items: center;
      background-color: #3a3a3a;
    }

    #logout {
      opacity: 0;
    }

    #main-holder {
      width: 50%;
      height: 70%;
      display: grid;
      justify-items: center;
      align-items: center;
      background-color: white;
      border-radius: 7px;
      box-shadow: 0px 0px 5px 2px black;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    #status-msg {
      color: #3a3a3a;
      word-break: break-all;
    }
  </style>

  <script>
    const mainHolder = document.getElementById('main-holder');
    const loginHeader = document.getElementById('login-header');
    const statusMsg = document.getElementById('status-msg');
    const logoutLink = document.getElementById('logout');

    logoutLink.addEventListener('click', (e) => {
      e.preventDefault();
      sessionStorage.removeItem('session');
      window.location.href = '/logout';
    });

    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const authError = urlParams.get('error');

    let token;
    let refreshToken;

    try {
      const parsedSession = JSON.parse(sessionStorage.getItem('session'));
      token = parsedSession?.token;
      refreshToken = parsedSession?.refreshToken;
    } catch (e) {}

    if (token) {
      axios
        .get('/', {
          headers: {
            Authorization: token,
            'x-refresh-token': refreshToken || '',
          },
        })
        .then((response) => {
          const { username, token: newToken } = response.data;

          if (!username) {
            sessionStorage.removeItem('session');
            window.location.replace('/login');
            return;
          }

          if (newToken) {
            sessionStorage.setItem(
              'session',
              JSON.stringify({
                token: newToken,
                refreshToken,
              }),
            );
          }

          loginHeader.remove();
          statusMsg.remove();
          mainHolder.append(`Hello ${username}`);
          logoutLink.style.opacity = 1;
        })
        .catch(() => {
          sessionStorage.removeItem('session');
          window.location.replace('/login');
        });
    } else if (authError) {
      const errorDescription = urlParams.get('error_description') || authError;
      loginHeader.textContent = 'Authentication Error';
      statusMsg.textContent = errorDescription;
    } else if (code) {
      statusMsg.textContent = 'Exchanging authorization code for tokens...';
      window.history.replaceState({}, document.title, '/');

      axios
        .post('/api/callback', { code })
        .then((response) => {
          sessionStorage.setItem('session', JSON.stringify(response.data));
          window.location.reload();
        })
        .catch(() => {
          loginHeader.textContent = 'Authentication Error';
          statusMsg.textContent = 'Failed to exchange authorization code.';
        });
    } else {
      window.location.replace('/login');
    }
  </script>
</html>
